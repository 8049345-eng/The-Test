<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE TEST</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f4f1e8; font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 50% 35%, #273449 0, #111827 42%, #070b12 100%);
    }
    main {
      width: min(620px, 100%); padding: 48px 28px; text-align: center;
      background: #111827eF; border: 1px solid #657187; border-radius: 18px;
      box-shadow: 0 24px 80px #0009;
    }
    .tag { color: #ffcf66; font-size: 12px; font-weight: 800; letter-spacing: 4px; }
    h1 { margin: 14px 0 8px; font-size: clamp(48px, 12vw, 86px); letter-spacing: 7px; }
    p { color: #c4ccda; line-height: 1.6; margin: 0 auto 28px; max-width: 420px; }
    a {
      display: inline-block; padding: 15px 38px; border-radius: 9px;
      background: #ffcf66; color: #171717; font-size: 17px;
      font-weight: 900; letter-spacing: 1px; text-decoration: none;
      transition: transform .15s, filter .15s;
    }
    a:hover { transform: translateY(-3px); filter: brightness(1.08); }
    .hint { margin-top: 24px; color: #8994a6; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">FINAL EXAM • CLASSROOM SURVIVAL</div>
    <h1>THE TEST</h1>
    <p>Keep your cool, get through the test, and whatever you do… don't get caught.</p>
    <a href="./game.html">PLAY GAME</a>
    <div class="hint">Press PLAY to enter the classroom.</div>
  </main>
</body>
</html>
